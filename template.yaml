AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: InkFig Main System FastAPI Lambda

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Application environment name.
  CorsOrigins:
    Type: String
    Description: JSON array of trusted frontend origins for FastAPI CORS.
  SupabaseUrl:
    Type: String
    Description: Supabase project URL.
  SupabaseSecretKey:
    Type: String
    NoEcho: true
    Description: Backend-only Supabase secret key.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: SQLAlchemy asyncpg URL using the Supabase Session Pooler.
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Same JWT signing secret used by inkfig-user-system.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for main-api.inkfig-hu.com in the deployment region.
  ProjectName:
    Type: String
    Default: inkfig
    Description: Project tag used for AWS resource organization and cost allocation.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        APP_NAME: inkfig-main-system
        ENVIRONMENT: !Ref Environment
        API_PREFIX: /api/v1
        CORS_ORIGINS: !Ref CorsOrigins
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
        DATABASE_URL: !Ref DatabaseUrl
        JWT_SECRET: !Ref JwtSecret
        JWT_ISSUER: inkfig-user-system
        ACCESS_COOKIE_NAME: inkfig_access
        WORKS_BUCKET: works
        VOYAGE_SECRET_ID: inkfig/main/voyage
        VOYAGE_MODEL: voyage-multimodal-3.5
        VOYAGE_EMBEDDING_DIMENSION: "1024"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-http-api"
      StageName: $default
      Tags:
        Project: !Ref ProjectName
        Service: main-system
        Environment: !Ref Environment
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: main-api.inkfig-hu.com
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Project: !Ref ProjectName
        Service: main-system
        Environment: !Ref Environment

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - HttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: .
      Handler: src.lambda_handler.handler
      Tags:
        Project: !Ref ProjectName
        Service: main-system
        Environment: !Ref Environment
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:inkfig/main/voyage-*"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint for the InkFig main system.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ApiFunctionArn:
    Description: Main-system Lambda function ARN.
    Value: !GetAtt ApiFunction.Arn
  CustomDomainUrl:
    Description: Public custom URL for the InkFig main system.
    Value: https://main-api.inkfig-hu.com
  CloudflareCnameTarget:
    Description: Set the Cloudflare main-api CNAME target to this API Gateway hostname.
    Value: !GetAtt ApiDomainName.RegionalDomainName
